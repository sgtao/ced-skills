[project]
name = "ced-skills"
version = "0.0.2"
description = "explain 系のスキル（ced-*）の開発用の依存とテスト。配布物は plugins/ で、この pyproject は配らない"
requires-python = ">=3.10"
# 元のリポジトリ 11（url-to-md・pdf-to-md-ja）の依存を、そのまま引き継ぐ。
dependencies = [
    "markitdown[docx,xlsx,pptx]>=0.1.5",
    "trafilatura",
    "beautifulsoup4",
    "yt-dlp",
    "pypdf",
    "pdfplumber",
    "pypdfium2",
    "pillow",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
